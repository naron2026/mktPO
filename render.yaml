services:
  - type: web
    name: po-editor
    runtime: node
    plan: starter # persistent disks need a paid instance
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PO_WORKSPACE
        value: /var/data/workspace
      - key: PO_DATA
        value: /var/data/data
      - key: PO_PASSWORD
        sync: false # asked for when the Blueprint is created
    disk:
      name: po-data
      mountPath: /var/data
      sizeGB: 1
